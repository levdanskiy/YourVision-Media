<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">ALMANAC: TABLE July 2026 logo</title>
  <desc id="desc">Square editorial logo with the text ALMANAC: TABLE, a table-like oval, fork and spoon marks, and July recipe archive accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#15120f"/>
      <stop offset="0.52" stop-color="#242018"/>
      <stop offset="1" stop-color="#0f0e0c"/>
    </linearGradient>
    <radialGradient id="tableGlow" cx="50%" cy="48%" r="56%">
      <stop offset="0" stop-color="#f3e3bd" stop-opacity="0.24"/>
      <stop offset="0.58" stop-color="#bf3b2c" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#15120f" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <rect x="42" y="42" width="940" height="940" rx="38" fill="none" stroke="#e7d7b3" stroke-opacity="0.22" stroke-width="2"/>
  <circle cx="512" cy="494" r="368" fill="url(#tableGlow)"/>

  <ellipse cx="512" cy="514" rx="328" ry="238" fill="#1c1914" stroke="#e7d7b3" stroke-width="3" stroke-opacity="0.92" filter="url(#softShadow)"/>
  <ellipse cx="512" cy="514" rx="276" ry="194" fill="none" stroke="#8b9a5a" stroke-width="2" stroke-opacity="0.54" stroke-dasharray="3 18"/>

  <g stroke-linecap="round" stroke-linejoin="round" opacity="0.72">
    <path d="M194 365 L194 673" stroke="#e7d7b3" stroke-width="10"/>
    <path d="M167 365 L167 457" stroke="#e7d7b3" stroke-width="7"/>
    <path d="M194 365 L194 457" stroke="#e7d7b3" stroke-width="7"/>
    <path d="M221 365 L221 457" stroke="#e7d7b3" stroke-width="7"/>
    <path d="M167 457 C167 488 221 488 221 457" fill="none" stroke="#e7d7b3" stroke-width="7"/>

    <path d="M830 365 C873 418 863 497 816 528 L816 673" fill="none" stroke="#e7d7b3" stroke-width="10"/>
    <path d="M830 365 C791 413 791 497 816 528" fill="none" stroke="#e7d7b3" stroke-width="10"/>
  </g>

  <g fill="none" stroke="#bf3b2c" stroke-width="9" stroke-linecap="round">
    <path d="M398 707 C468 732 565 734 632 707"/>
    <path d="M384 325 C450 294 574 293 640 325"/>
  </g>

  <text x="512" y="446" text-anchor="middle" fill="#f2e4c4"
        font-family="Noto Serif Display, Noto Serif, Georgia, serif"
        font-size="78" font-weight="700" letter-spacing="5">ALMANAC:</text>
  <text x="512" y="565" text-anchor="middle" fill="#f2e4c4"
        font-family="Noto Serif Display, Noto Serif, Georgia, serif"
        font-size="118" font-weight="700" letter-spacing="7">TABLE</text>
  <text x="512" y="634" text-anchor="middle" fill="#8b9a5a"
        font-family="Noto Serif, Georgia, serif"
        font-size="24" font-weight="700" letter-spacing="5">JULY 2026 / RECIPE ARCHIVE</text>

  <g fill="#bf3b2c">
    <circle cx="411" cy="628" r="7"/>
    <circle cx="512" cy="650" r="7"/>
    <circle cx="613" cy="628" r="7"/>
  </g>

  <text x="512" y="838" text-anchor="middle" fill="#e7d7b3" fill-opacity="0.72"
        font-family="Noto Serif, Georgia, serif"
        font-size="24" letter-spacing="4">09:04 / 15:04 / 21:04</text>
